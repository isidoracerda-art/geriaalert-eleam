<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeriaAlert ELEAM</title>
<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
color:white;
padding:30px;
}
.container{
max-width:1200px;
margin:auto;
}
.header{
background:white;
color:#111;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}
.header h1{
margin:0;
font-size:38px;
}
.sub{
color:gray;
font-size:14px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:25px;
}
.card{
background:white;
color:#111;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}
.card h2{
margin-top:0;
font-size:18px;
}
input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
}
.red{color:#dc2626;}
.green{color:#16a34a;}
.yellow{color:#ca8a04;}
.footer{
text-align:center;
margin-top:30px;
font-size:13px;
opacity:.8;
}
</style>
</head>
<body>
<div class="container">

<div class="header">
<div>
<h1>GeriaAlert ELEAM</h1>
<div class="sub">Sistema premium de seguimiento VGI • 68 residentes</div>
</div>
<div>
Universidad Central<br>
Corporación Quetelet
</div>
</div>

<div class="grid">

<div class="card">
<h2>Total residentes</h2>
<input value="68">
</div>

<div class="card">
<h2 class="red">Vencen hoy</h2>
<input value="6">
</div>

<div class="card">
<h2 class="yellow">Pendientes</h2>
<input value="18">
</div>

<div class="card">
<h2 class="green">Completados</h2>
<input value="50">
</div>

</div>

<div class="grid">

<div class="card">
<h2 class="red">VGI vencen hoy</h2>
<input value="Dory">
<input value="Marta">
<input value="Luis">
</div>

<div class="card">
<h2 class="yellow">Próximos</h2>
<input value="Ana - 2 días">
<input value="Pedro - 5 días">
<input value="Rosa - 7 días">
</div>

<div class="card">
<h2 class="green">Al día</h2>
<input value="Carlos">
<input value="Elena">
<input value="Julia">
</div>

</div>

<div class="footer">
Proyecto de Innovación Tecnológica • Internado 2026
</div>

</div>
</body>
</html>
