<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeriaAlert ELEAM</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
color:white;
padding:30px;
}
.container{max-width:1100px;margin:auto;}

.card{
background:white;
color:#111;
padding:20px;
border-radius:18px;
margin-top:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

input,select,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
border:none;
cursor:pointer;
}

.item{
background:#f1f5f9;
padding:10px;
border-radius:10px;
margin-top:8px;
font-size:14px;
}

.actions{
margin-top:8px;
display:flex;
gap:5px;
}

.actions button{
flex:1;
padding:5px;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>GeriaAlert ELEAM</h1>
<p>Corporación Quetelet • Universidad Central</p>
<p>Última actualización: <span id="fecha"></span></p>

<div class="grid">

<div class="card">
<h3>Total residentes</h3>
<input id="total" readonly>
</div>

<div class="card">
<h3>🔴 Vencidos</h3>
<input id="vencidosCount" readonly>
</div>

<div class="card">
<h3>🟡 Próximos</h3>
<input id="proximosCount" readonly>
</div>

<div class="card">
<h3>🟢 Al día</h3>
<input id="aldiaCount" readonly>
</div>

</div>

<div class="card">
<h3>Agregar residente</h3>

<input id="nombre" placeholder="Nombre residente">
<input type="date" id="fechaVGI">

<select id="estado">
<option value="aldia">🟢 Al día</option>
<option value="proximo">🟡 Próximo</option>
<option value="vencido">🔴 Vencido</option>
</select>

<button onclick="guardar()">Guardar</button>
</div>

<div class="grid">

<div class="card">
<h3>🔴 Vencidos</h3>
<div id="vencidos"></div>
</div>

<div class="card">
<h3>🟡 Próximos</h3>
<div id="proximos"></div>
</div>

<div class="card">
<h3>🟢 Al día</h3>
<div id="aldia"></div>
</div>

</div>

</div>

<script>

document.getElementById("fecha").innerHTML =
new Date().toLocaleDateString("es-CL");

function crearItem(texto){

let div = document.createElement("div");
div.className="item";

let contenido = document.createElement("div");
contenido.innerText = texto;

let acciones = document.createElement("div");
acciones.className="actions";

let mover = document.createElement("button");
mover.innerText="Mover";

let eliminar = document.createElement("button");
eliminar.innerText="Eliminar";

acciones.appendChild(mover);
acciones.appendChild(eliminar);

div.appendChild(contenido);
div.appendChild(acciones);

// EVENTOS
mover.onclick = function(){
moverEstado(div);
}

eliminar.onclick = function(){
div.remove();
actualizar();
}

return div;
}

function moverEstado(item){

let padre = item.parentElement.id;

if(padre=="aldia"){
document.getElementById("proximos").appendChild(item);
}
else if(padre=="proximos"){
document.getElementById("vencidos").appendChild(item);
}
else{
document.getElementById("aldia").appendChild(item);
}

actualizar();
}

function guardar(){

let nombre = document.getElementById("nombre").value;
let fecha = document.getElementById("fechaVGI").value;
let estado = document.getElementById("estado").value;

if(nombre=="" || fecha==""){
alert("Completa datos");
return;
}

let evalua = new Date(fecha);
let proxima = new Date(evalua);
proxima.setFullYear(proxima.getFullYear()+1);

let texto = nombre + " - vence " + proxima.toLocaleDateString("es-CL");

let item = crearItem(texto);

if(estado=="vencido"){
document.getElementById("vencidos").appendChild(item);
}
else if(estado=="proximo"){
document.getElementById("proximos").appendChild(item);
}
else{
document.getElementById("aldia").appendChild(item);
}

document.getElementById("nombre").value="";
document.getElementById("fechaVGI").value="";

actualizar();
}

function actualizar(){

let v = document.querySelectorAll("#vencidos .item").length;
let p = document.querySelectorAll("#proximos .item").length;
let a = document.querySelectorAll("#aldia .item").length;

document.getElementById("vencidosCount").value = v;
document.getElementById("proximosCount").value = p;
document.getElementById("aldiaCount").value = a;
document.getElementById("total").value = v + p + a;
}

actualizar();

</script>

</body>
</html>
