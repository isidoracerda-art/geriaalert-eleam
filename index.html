<script>
function guardar(){

let nombre = document.getElementById("nombre").value;
let fecha = document.getElementById("fechaVGI").value;

if(nombre=="" || fecha==""){
alert("Completa datos");
return;
}

let hoy = new Date();
let fechaEval = new Date(fecha);

let proxima = new Date(fechaEval);
proxima.setFullYear(proxima.getFullYear()+1);

let diff = Math.floor((proxima - hoy)/(1000*60*60*24));

let box = document.createElement("div");
box.className="item";
box.innerHTML = nombre + " - vence " + proxima.toLocaleDateString("es-CL");

if(diff < 0){
document.getElementById("vencidos").appendChild(box);
}
else if(diff <= 30){
document.getElementById("proximos").appendChild(box);
}
else{
document.getElementById("aldia").appendChild(box);
}

document.getElementById("nombre").value="";
document.getElementById("fechaVGI").value="";
}
</script>
