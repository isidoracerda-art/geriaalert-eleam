<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeriaAlert ELEAM</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
color:white;
padding:30px;
}

.container{max-width:1200px;margin:auto;}

.header{
background:white;
color:#111;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.header h1{margin:0;font-size:38px;}
.sub{color:gray;font-size:14px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:25px;
}

.card{
background:white;
color:#111;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:12px;
background:#1d4ed8;
color:white;
font-weight:bold;
cursor:pointer;
}

.red{color:#dc2626;}
.green{color:#16a34a;}
.yellow{color:#ca8a04;}

.item{
margin-top:8px;
}

.footer{
text-align:center;
margin-top:30px;
font-size:13px;
opacity:.8;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<div>
<h1>GeriaAlert ELEAM</h1>
<div class="sub">Sistema de seguimiento VGI • 68 residentes</div>
<div class="sub">Corporación Quetelet • Universidad Central</div>
</div>

<div>
<strong>Última actualización:</strong><br>
<span id="fechaActual"></span>
</div>
</div>

<div class="grid">

<div class="card">
<h2>Total residentes</h2>
<input id="total" readonly>
</div>

<div class="card">
<h2 class="red">Vencen hoy</h2>
<input id="vencenHoy" readonly>
</div>

<div class="card">
<h2 class="yellow">Pendientes</h2>
<input id="pendientes" readonly>
</div>

<div class="card">
<h2 class="green">Completados</h2>
<input id="completados" readonly>
</div>

</div>

<div class="grid">

<div class="card">
<h2>Agregar Residente / VGI</h2>

<label>Nombre residente</label>
<input id="nombre" placeholder="Ej: Dory González">

<label>Fecha VGI</label>
<input type="date" id="fechaVGI">

<button onclick="guardarRegistro()">Guardar Registro</button>
</div>

<div class="card">
<h2 class="red">VGI próximos a vencer</h2>
<div id="listaVencer"></div>
</div>

<div class="card">
<h2 class="green">Evaluados al día</h2>
<div id="listaDia"></div>
</div>

</div>

<div class="footer">
Proyecto de Innovación Tecnológica • Internado 2026
</div>

</div>

<script>

document.getElementById("fechaActual").innerHTML =
new Date().toLocaleDateString("es-CL");

function guardarRegistro(){

let nombre = document.getElementById("nombre").value;
let fecha = document.getElementById("fechaVGI").value;

if(nombre=="" || fecha==""){
alert("Completa datos");
return;
}

let hoy = new Date();
let fechaEval = new Date(fecha);

let proxima = new Date(fechaEval);
proxima.setFullYear(proxima.getFullYear()+1);

let dias = Math.floor((proxima - hoy)/(1000*60*60*24));

let nuevo = document.createElement("input");
nuevo.className="item";
nuevo.readOnly=false;

if(dias < 0){
nuevo.value = nombre + " - VENCIDO";
document.getElementById("listaVencer").appendChild(nuevo);
}
else if(dias <= 30){
nuevo.value = nombre + " - vence " + proxima.toLocaleDateString("es-CL");
document.getElementById("listaVencer").appendChild(nuevo);
}
else{
nuevo.value = nombre;
document.getElementById("listaDia").appendChild(nuevo);
}

document.getElementById("nombre").value="";
document.getElementById("fechaVGI").value="";

actualizarContadores();
}

function actualizarContadores(){

let vencer = document.querySelectorAll("#listaVencer input").length;
let aldia = document.querySelectorAll("#listaDia input").length;

document.getElementById("vencenHoy").value = vencer;
document.getElementById("pendientes").value = vencer;
document.getElementById("completados").value = aldia;
document.getElementById("total").value = vencer + aldia;
}

actualizarContadores();

</script>

</body>
</html>
